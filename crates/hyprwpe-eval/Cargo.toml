[package]
name = "hyprwpe-eval"
version = "0.1.0"
edition = "2021"

[dependencies]
hyprwpe-core = { path = "../hyprwpe-core" }
hyprwpe-unpacker = { path = "../hyprwpe-unpacker" }
hyprwpe-scene = { path = "../hyprwpe-scene" }
hyprwpe-runner = { path = "../hyprwpe-runner" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = "0.24"
imageproc = "0.23"
rusttype = "0.9"
clap = { version = "4.4", features = ["derive"] }
thiserror = "1.0"
rayon = "1.8"
crossbeam-channel = "0.5"

[dev-dependencies]
tempfile = "3.8"
