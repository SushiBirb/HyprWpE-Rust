[package]
name = "hyprwpe-gui"
version = "0.1.0"
edition = "2021"

[dependencies]
hyprwpe-core = { path = "../hyprwpe-core" }
hyprwpe-runner = { path = "../hyprwpe-runner" }
gtk4 = { version = "0.11", features = ["v4_10"] }
gdk-pixbuf = "0.22"
gio = "0.22"
glib = "0.22"
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
