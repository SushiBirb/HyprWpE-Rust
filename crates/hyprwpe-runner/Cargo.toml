[package]
name = "hyprwpe-runner"
version = "0.1.0"
edition = "2021"

[dependencies]
hyprwpe-core = { path = "../hyprwpe-core" }
hyprwpe-unpacker = { path = "../hyprwpe-unpacker" }
hyprwpe-scene = { path = "../hyprwpe-scene" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
tiny_http = "0.12"
urlencoding = "2.1"
fs2 = "0.4"
thiserror = "1.0"

[dev-dependencies]
reqwest = { version = "0.11", features = ["blocking"] }
tempfile = "3.8"
